<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINES Game</title>
    <style>
        /* General Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #1b1f23;
            color: white;
        }

        #header h2 {
            margin: 0;
        }

        #header button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
        }

        #header button:hover {
            background-color: #45a049;
        }

        /* Main Layout */
        #main-container {
            flex: 1;
            display: flex;
        }

        /* Left Control Panel */
        #control-panel {
            width: 300px;
            background-color: #101417;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-size: 16px;
        }

        input, select, button {
            padding: 10px;
            font-size: 16px;
            width: 100%;
        }

        button {
            background-color: #4caf50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        /* Right Game Section */
        #game-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background-color: #1b1f23;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(5, 80px);
            grid-gap: 5px;
        }

        .tile {
            width: 80px;
            height: 80px;
            background-color: #303841;
            border: 2px solid #3a444c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            cursor: pointer;
        }

        .tile.revealed {
            background-color: #3a444c;
            cursor: default;
        }

        .tile.mine {
            background-color: #ff4d4d;
            color: white;
        }

        .error-message {
            color: red;
            font-size: 12px;
            display: none;
        }

        #navigatorBox {
            justify-content: left;
            align-items: left;
            border: 1px solid #3a444c;
        }

         /* Header */
         #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #101417;
            padding: 10px 50px;
            font-size: 18px;
            border-bottom: 5px solid #3a444c;
        }
        .split {
    display: flex; /* Align items in a row */
    gap: 10px; /* Spacing between elements */
    align-items: center; /* Vertically center items */
}

.split input {
    flex-grow: 1; /* Allow input field to take remaining space */
    padding: 8px;
    font-size: 16px;
    border: 1px solid #3a444c;
    border-radius: 5px;
    background-color: #1b1f23;
    color: white;
    min-width: 150px; /* Ensure input field has a reasonable width */
}
.cashout-container {
    display: flex;
    align-items: center;
    gap: 10px; /* Spacing between elements */
}

.cashout-container label {
    font-size: 16px;
    color: white;
}

.fixed-btn {
    padding: 8px 12px;
    font-size: 14px;
    background-color: #4caf50;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    text-align: center;
    white-space: nowrap; /* Prevent text wrapping */
}

.fixed-btn:hover {
    background-color: #45a049;
}


    </style>
</head>
<body>

    <!-- Header Section -->
    <div id="header">
        <section>
            <img src="casino_assets/images/jokerlogo.png" style="border: 1px solid #3a444c; width: 75px; border-radius: 5px;">
        </section>
        <section>
            <div id="split">you are playing:</div><h2 id="split">MINES</h2>
        </section>
        <div id="navigatorBox">
            <div id="split">Balance: <span id="user-balance">0.00000000</span> BTC</div>
        </div>
        <div id="gameBox"><section><button onclick="goBack()">← Back to menu</button></section></div>
        
        
    </div>

    <!-- Main Content -->
    <div id="main-container">
        <!-- Left Control Panel -->
        <div id="control-panel">
            <label for="betAmount">Bet Amount:</label>
            <span class="error-message" id="bet-error">Please enter a valid bet amount.</span>
            <div class="split">
                <input type="text" id="betAmount" placeholder="Enter Bet" aria-label="Bet Amount" oninput="validateNumberInput(this)" />
                <button class="fixed-btn" onclick="halveBet()">1/2</button>
                <button class="fixed-btn" onclick="doubleBet()">x2</button>
            </div>
            
            
            <label for="mineCount">Mines:</label>
            <span class="error-message" id="mine-error">Please select a valid mine count.</span>
            <select id="mineCount"></select>

            <button onclick="startGame()">Bet</button>

            <label for="cashout">Cashout:</label>  <input type="text" id="cashoutDisplay" value="0.00" readonly />
            <div class="cashout-container">
                <button id="cashoutButton" class="fixed-btn" onclick="cashout()">Cashout (x1.0)</button>
            </div>
            

        </div>

        <!-- Right Game Section -->
        <div id="game-section">
            <div id="grid"></div>
        </div>
    </div>

    <script>
        const gridSize = 5; // 5x5 grid
        let mineCount = 3;
        let betAmount = 0;
        let grid = [];
        let canStartGame = true;
        const gridElement = document.getElementById("grid");
        let balance = 1000; // User balance for testing
        let canClick = false;
        let cashoutMultiplier = 1; // Multiplier for cashout calculation
        let gemsClicked = 0;
    
        // Populate Mines Dropdown
        function populateMineDropdown() {
            const mineSelect = document.getElementById("mineCount");
            for (let i = 1; i <= 24; i++) {
                const option = document.createElement("option");
                option.value = i;
                option.textContent = i;
                mineSelect.appendChild(option);
            }
        }
    
        // Initialize Grid
        function initializeGrid() {
            gridElement.innerHTML = "";
            grid = [];
            cashoutMultiplier = 1; // Reset multiplier
            gemsClicked = 0; // Reset gems clicked
            updateCashoutDisplay();
    
            let minePositions = new Set();
            while (minePositions.size < mineCount) {
                minePositions.add(Math.floor(Math.random() * gridSize * gridSize));
            }
    
            for (let i = 0; i < gridSize * gridSize; i++) {
                grid.push({
                    isMine: minePositions.has(i),
                    revealed: false,
                });
    
                const tile = document.createElement("div");
                tile.classList.add("tile");
                tile.setAttribute("data-index", i);
                tile.addEventListener("click", () => revealTile(i, tile));
                gridElement.appendChild(tile);
            }
        }
    
        // Calculate Cashout Multiplier
function calculateCashoutMultiplier(totalTiles, mineCount, gemsClicked) {
    const safeTiles = totalTiles - mineCount;
    const remainingSafeTiles = safeTiles - gemsClicked;
    const remainingTotalTiles = totalTiles - gemsClicked;

    if (remainingSafeTiles <= 0 || remainingTotalTiles <= 0) {
        return 0; // Game over or invalid state
    }

    // Calculate the probability of selecting a safe tile
    let probability = remainingSafeTiles / remainingTotalTiles;

    // Calculate the multiplier based on the inverse of the probability
    let multiplier = 1 / probability;

    // Apply an exponential factor to increase the multiplier more significantly with each gem clicked
    multiplier = Math.pow(multiplier, gemsClicked);

    // Ensure the multiplier is at least 1
    return Math.max(multiplier, 1);
}



    
        // Reveal Tile
        function revealTile(index, tile) {
            if (!canClick || grid[index].revealed) return;
    
            grid[index].revealed = true;
            tile.classList.add("revealed");
    
            if (grid[index].isMine) {
                tile.textContent = "💣";
                tile.classList.add("mine");
                revealAllMines();
                canClick = false;
                updateCashout(0); // User hit a mine
                canStartGame = true;
            } else {
                tile.textContent = "💎";
                gemsClicked++;
                cashoutMultiplier = calculateCashoutMultiplier(gridSize * gridSize, mineCount, gemsClicked);
                updateCashout(1); // Update multiplier display
                updateCashoutDisplay(); // Update cashout field with new value
                canStartGame = false;
            }
        }
    
        // Reveal All Mines
        function revealAllMines() {
            grid.forEach((tileData, i) => {
                if (tileData.isMine) {
                    const tile = document.querySelector(`[data-index="${i}"]`);
                    tile.textContent = "💣";
                    tile.classList.add("mine", "revealed");
                }
            });
        }
    
        // Update Cashout Display
        function updateCashout(bin) {
            const cashoutButton = document.getElementById("cashoutButton");
            const cashoutDisplay = document.getElementById("cashoutDisplay");
            if (bin === 0) {
                cashoutMultiplier = 0; // Reset multiplier
                cashoutButton.innerText = `Cashout (x0.0)`;
                //alert("Game Over! You hit a mine.");
                cashoutDisplay.value = 0;
            } else if (bin === 1) {
                cashoutButton.innerText = `Cashout (x${cashoutMultiplier.toFixed(2)})`;
            }
        }
    
        function updateCashoutDisplay() {
            const cashoutButton = document.getElementById("cashoutButton");
            const cashoutDisplay = document.getElementById("cashoutDisplay");
    
            // Update the button with the current multiplier
            cashoutButton.innerText = `Cashout (x${cashoutMultiplier.toFixed(2)})`;
    
            // Update the display field with the cashout value
            cashoutDisplay.value = (betAmount * cashoutMultiplier).toFixed(2);
        }
    
        // Reveal All Tiles
function revealAllTiles() {
    grid.forEach((tileData, i) => {
        const tile = document.querySelector(`[data-index="${i}"]`);
        if (tileData.isMine) {
            tile.textContent = "💣";
            tile.classList.add("mine", "revealed");
        } else {
            tile.textContent = "💎";
            tile.classList.add("revealed");
        }
    });
}

// Cashout Logic
function cashout() {
    if (!canClick || cashoutMultiplier === 0) return;

    const winnings = betAmount * cashoutMultiplier;
    balance += winnings;
    //alert(`You cashed out! Winnings: ${winnings.toFixed(2)} BTC`);

    // Reveal all tiles upon cashout
    revealAllTiles();

    // Disable further clicks until a new game starts
    canClick = false;
    canStartGame = true;

    // Update balance display
    document.getElementById("user-balance").innerText = balance.toFixed(8) + " BTC";
}

// Start Game
function startGame() {
    if (canStartGame) {
        const betInput = document.getElementById("betAmount");
        const mineInput = document.getElementById("mineCount").value;

        betAmount = parseFloat(betInput.value);

        // Validate Bet Amount
        if (isNaN(betAmount) || betAmount <= 0 || betAmount > balance) {
            //alert("Please enter a valid bet amount within your balance.");
            betInput.value = "";
            betInput.focus();
            return;
        }

        // Validate Mines Count
        mineCount = parseInt(mineInput);
        if (mineCount < 1 || mineCount > 24) {
            //alert("Please select a valid number of mines.");
            return;
        }

        // Deduct bet and initialize game
        balance -= betAmount;
        document.getElementById("user-balance").innerText = balance.toFixed(8) + " BTC";
        initializeGrid();
        canClick = true;
        canStartGame = false;
    }
}

    
        // Reset Game State
        function resetGame() {
            canClick = false;
            initializeGrid();
            document.getElementById("user-balance").innerText = balance.toFixed(8) + " BTC";
        }
    
        // Halve Bet
        function halveBet() {
            const betInput = document.getElementById("betAmount");
            let currentBet = parseFloat(betInput.value) || 0;
            betInput.value = (currentBet / 2).toFixed(2);
        }
    
        // Double Bet
        function doubleBet() {
            const betInput = document.getElementById("betAmount");
            let currentBet = parseFloat(betInput.value) || 0;
            betInput.value = (currentBet * 2).toFixed(2);
        }
    
        // Initialize on Page Load
        document.addEventListener("DOMContentLoaded", () => {
            populateMineDropdown();
            document.getElementById("user-balance").innerText = balance.toFixed(8) + " BTC";
            initializeGrid();
        });
    </script>
    
    
    
</body>
</html>
